<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="use-iframe" content="true"><meta name="html-box-height-mode" content="auto"><meta name="description" content="@@TITLE@@：TODO看板与双时间轴甘特图"><title>@@TITLE@@</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#202938;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif}a{color:inherit;text-decoration:none}button,input,select{font:inherit}button,a,input,select{outline-offset:3px}button{cursor:pointer}.app{max-width:100%;padding:16px 14px;border:1px solid #e2e7f0;border-radius:16px;background:linear-gradient(150deg,#f6f9ff,#fff 45%)}.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.8px;color:#738095}.head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.head h1{font-size:24px;margin:3px 0 4px;letter-spacing:-.5px}.sub{color:#6b7789;font-size:12px}.open{border:1px solid #d9e1ee;border-radius:8px;padding:7px 11px;font-size:12px;background:#fff;color:#365174}.open[hidden]{display:none}.summary{display:flex;gap:8px;margin:17px 0;flex-wrap:wrap}.metric{padding:9px 14px;border:1px solid #e5eaf3;background:white;border-radius:10px;min-width:100px;flex:1}.metric strong{display:block;font-size:24px;font-weight:650;color:#24334b}.metric span{font-size:11px;color:#7d8799}.tabs{display:flex;gap:4px;border-bottom:1px solid #e1e7f0;margin-bottom:14px}.tab{border:0;background:none;color:#6a7588;padding:10px 18px;font-weight:600;border-bottom:3px solid transparent}.tab.active{color:#147d70;border-bottom-color:#147d70}.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 13px}.filters input{flex:1;min-width:140px}.filters input,.filters select{height:34px;border:1px solid #dae1ec;background:#fff;border-radius:7px;padding:5px 9px;color:#4e5c71}.seg{display:flex;background:#eaf0f8;border-radius:7px;padding:3px;gap:2px}.seg button{background:none;border:0;border-radius:5px;padding:4px 10px;color:#617086;font-size:12px}.seg button.active{background:white;color:#11695e;box-shadow:0 1px 3px #d8e0ed}.barhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 12px}.hint{color:#8490a2;font-size:11px}.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px;align-items:start;min-height:420px}.lane{background:#f1f4f9;border:1px solid #e8ecf3;border-radius:10px;min-width:0}.lane-head{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:650;padding:11px 12px;border-bottom:1px solid #e4e9f1}.dot{width:7px;height:7px;border-radius:99px;background:var(--accent,#718096)}.count{margin-left:auto;color:#7a889c;font-size:11px;font-weight:400}.cards{padding:10px;display:grid;gap:10px;max-height:680px;overflow-y:auto;scrollbar-gutter:stable}.card{display:block;background:#fff;border:1px solid #e1e6ee;border-left:3px solid var(--accent);border-radius:7px;padding:12px;box-shadow:0 1px 2px #1d355708;transition:box-shadow .12s,border-color .12s}.card:hover{box-shadow:0 4px 12px #204d7c1a;border-color:#93c5be}.id{font-size:10px;letter-spacing:.4px;color:#8a96a8}.child{font-size:9px;background:#f1f4f8;padding:1px 4px;border-radius:3px;margin-left:5px}.title{font-size:14px;font-weight:600;line-height:1.55;margin:5px 0 8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.tags{display:flex;gap:4px;flex-wrap:wrap}.tag{font-size:10px;border-radius:4px;padding:2px 5px;background:#f0f4fb;color:#59718f}.status{background:#f1f4f8;color:#4c5d77}.foot{display:flex;justify-content:space-between;gap:4px;color:#8892a4;font-size:10px;margin-top:9px}.deps{font-size:9px;color:#8796ab;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{color:#a0aaba;text-align:center;padding:28px 10px;font-size:11px}.panel[hidden]{display:none}.timeline-viewport{border:1px solid #dfe6ef;border-radius:10px;overflow:auto;max-height:720px;background:white}.timeline{position:relative;min-width:100%;width:max-content}.tl-row{display:grid;grid-template-columns:200px var(--time-width);min-height:38px;border-bottom:1px solid #edf0f5}.tl-label{position:sticky;left:0;background:#fff;z-index:3;border-right:1px solid #e4e9f1;padding:7px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}.tl-label .id{margin-right:5px}.tl-scale{position:sticky;top:0;z-index:5;background:#f7f9fc}.tl-scale .tl-label{background:#f7f9fc;font-weight:600}.days,.track{display:grid;grid-template-columns:repeat(var(--days),var(--day-width));position:relative}.days span{text-align:center;font-size:9px;color:#8692a5;border-right:1px solid #e9edf3;padding:7px 0;line-height:1.2}.days span b{display:block;color:#51617b;font-size:10px}.days span.today{background:#e3f3ee;color:#11695e}.track{background-image:linear-gradient(to right,#edf0f5 1px,transparent 1px);background-size:var(--day-width) 100%;align-items:center}.task-bar{height:23px;min-width:5px;margin:5px 1px;border-radius:5px;background:var(--accent);color:white;font-size:10px;line-height:23px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 7px;z-index:1;box-shadow:0 2px 3px #0000000b}.task-bar.child-bar{opacity:.75;height:18px;line-height:18px;margin-top:7px;margin-bottom:7px}.nowline{position:absolute;top:0;bottom:0;border-left:1px dashed #147d7088;pointer-events:none}.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:10px;color:#6d7d94}.legend span{display:flex;align-items:center;gap:5px}.footer{font-size:10px;color:#98a2b3;margin-top:14px;border-top:1px solid #e7edf6;padding-top:10px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.filtered-empty{font-size:12px;color:#8795a9;padding:30px;text-align:center}.native-link{color:#147d70;font-size:11px;font-weight:600}.native-link[hidden]{display:none}@media(max-width:500px){.app{padding:14px 10px}.head h1{font-size:20px}.metric{min-width:75px;padding:7px 9px}.metric strong{font-size:20px}.tl-row{grid-template-columns:145px var(--time-width)}.board{grid-template-columns:minmax(0,1fr)}.tab{padding:9px 12px}}
</style></head><body><div class="app" id="@@MARKER@@">
<div class="head"><div><div class="eyebrow">@@EYEBROW@@</div><h1>@@TITLE@@</h1><div class="sub">看清下一步，也看清 AI 实施窗口与人工交付验收时间线。</div></div><a class="open" id="tasklist-link" target="_blank" rel="noopener">打开任务清单 ↗</a></div>
<div class="summary" id="summary"></div>
<div class="tabs" role="tablist"><button class="tab active" data-tab="board-panel" role="tab" aria-selected="true">TODO 看板</button><button class="tab" data-tab="gantt-panel" role="tab" aria-selected="false">甘特时间轴</button></div>
<div class="filters"><select id="completion" aria-label="筛选完成状态"><option value="todo" selected>未完成任务</option><option value="all">全部任务</option><option value="done">已完成任务</option></select><input id="search" type="search" aria-label="搜索任务" placeholder="搜索编号或任务…"><select id="stage" aria-label="筛选阶段"><option value="">全部阶段</option></select><select id="category" aria-label="筛选领域"><option value="">全部领域</option></select><select id="level" aria-label="筛选层级"><option value="">主任务 + 子任务</option><option value="main">仅主任务</option><option value="child">仅子任务</option></select></div>
<section class="panel" id="board-panel"><div class="barhead"><div class="seg" aria-label="看板分组"><button data-group="stage">按项目阶段</button><button data-group="priority">按优先级</button><button data-group="status">按执行状态</button></div><a id="board-link" class="native-link" target="_blank" rel="noopener">打开完整看板 ↗</a></div><div class="board" id="board"></div></section>
<section class="panel" id="gantt-panel" hidden><div class="barhead"><div class="seg" aria-label="时间轴视图"><button class="active" data-time="ai">AI 开发时间</button><button data-time="acceptance">交付 / 验收时间</button></div></div><div class="barhead"><span class="hint" id="range-label"></span><a id="gantt-link" class="native-link" target="_blank" rel="noopener">打开完整甘特图 ↗</a></div><div class="timeline-viewport"><div class="timeline" id="timeline"></div></div><div class="legend" id="legend"></div></section>
<div class="footer"><span>点击卡片 / 时间条打开任务文档。TODO 默认仅显示未完成，完成状态以原生任务为准。</span><span>快照 @@GENERATED@@ · Powered by SOAR DevFlow</span></div>
<noscript>此交互总览需要启用 JavaScript；可使用本页上方任务清单或下方原生任务块。</noscript></div>
<script>
const tasks=@@DATA@@, links=@@LINKS@@, uiConfig=@@UI_CONFIG@@;
const statuses=['未开始','进行中','待人工验收','阻塞','已完成'];
const stageOrder=uiConfig.stageOrder||[];
const palette=['#3370ff','#149287','#e47c3c','#8057cf','#2b8a57','#c75d7e','#7a8a9e'];
const colors=Object.assign({P0:'#8057cf',P1:'#e47c3c',P2:'#4383df',P3:'#7a8a9e','未分级':'#9ba5b3','未开始':'#7d8fa9','进行中':'#3979e8','待人工验收':'#d99a29','阻塞':'#db6670','已完成':'#39a17e'}, uiConfig.stageColors||{});
let group=uiConfig.defaultGroup||'priority', timeMode='ai';
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function key(t){return (t.priority||'').match(/^P[0-3]/)?.[0]||'未分级';}
function color(t){return colors[key(t)]||colors['未分级'];}
function stageColor(label,idx){return colors[label]||palette[idx%palette.length];}
function dateLabel(v){return v?v.slice(5).replace('-','/'):'未排期';}
function filtered(){const q=document.querySelector('#search').value.toLowerCase().trim(),stg=document.querySelector('#stage').value,c=document.querySelector('#category').value,l=document.querySelector('#level').value,m=document.querySelector('#completion').value;return tasks.filter(t=>(m==='all'||(m==='done'?t.completed:!t.completed))&&(!q||(t.id+' '+t.title).toLowerCase().includes(q))&&(!stg||t.stage===stg)&&(!c||t.category===c)&&(!l||(l==='child')===t.child));}
function tooltip(t){return `${t.id} ${t.title}\n阶段：${t.stage||'未分阶段'}\nAI实施：${t.ai_hours==null?'工时待登记':t.ai_hours+'小时'}（${t.ai_range||'未给范围'}）\nAI窗口：${t.ai_start_time||'未排期'} 至 ${t.ai_end_time||'未排期'}\n交付/验收：${t.start||'未排期'} 至 ${t.end||'未排期'} · ${t.status}\n人工验收：${t.human_hours==null?'待估':t.human_hours+'小时'}\n${t.wait||''}\n前置：${(t.deps||[]).join('、')||'无'}`;}
function setLink(el,href){if(!href||href==='#'){el.hidden=true;el.removeAttribute('href');}else{el.hidden=false;el.href=href;}}
function renderSummary(){const values=[['主任务',tasks.filter(t=>!t.child).length],['进行中',tasks.filter(t=>t.status==='进行中').length],['待验收',tasks.filter(t=>t.status==='待人工验收').length],['阻塞',tasks.filter(t=>t.status==='阻塞').length],['已完成',tasks.filter(t=>t.status==='已完成').length]];document.querySelector('#summary').innerHTML=values.map(([l,n])=>`<div class="metric"><strong>${n}</strong><span>${l}</span></div>`).join('');}
function renderBoard(data){const allStages=[...stageOrder.filter(s=>tasks.some(t=>t.stage===s)),...[...new Set(tasks.map(t=>t.stage).filter(Boolean))].filter(s=>!stageOrder.includes(s))];const labels=group==='stage'?(allStages.length?allStages:['未分阶段']):group==='priority'?['P0','P1','P2','P3','未分级'].filter(p=>p!=='未分级'||data.some(t=>key(t)===p)):statuses.filter(s=>s!=='已完成'||document.querySelector('#completion').value!=='todo');setLink(document.querySelector('#board-link'),group==='stage'?(links.stage||links.board):group==='priority'?links.priority:links.board);document.querySelector('#board').innerHTML=labels.map((label,idx)=>{const items=data.filter(t=>(group==='stage'?(t.stage||'未分阶段'):group==='priority'?key(t):t.status)===label);const caption=group==='priority'?({P0:'P0 · 架构前置',P1:'P1 · 近期目标',P2:'P2 · 后续迭代',P3:'P3 · 外部依赖'}[label]||label):(group==='status'&&label==='未开始'?'待办':label);const accent=group==='stage'?stageColor(label,idx):(colors[label]||'#8b99ac');return `<div class="lane" style="--accent:${accent}"><div class="lane-head"><i class="dot"></i>${esc(caption)}<span class="count">${items.length}</span></div><div class="cards">${items.map(t=>`<a class="card" href="${esc(t.url||'#')}" target="_blank" rel="noopener" title="${esc(tooltip(t))}" style="--accent:${color(t)}"><div class="id">${esc(t.id)}${t.child?'<span class="child">子任务</span>':''}</div><div class="title">${esc(t.title)}</div><div class="tags">${t.stage?`<span class="tag">${esc(t.stage.split('·')[0])}</span>`:''}<span class="tag">${esc(t.category)}</span><span class="tag status">${esc(t.status)}</span><span class="tag">${t.ai_hours==null?'AI工时待登记':t.ai_hours===0?'汇总任务':'AI约 '+esc(t.ai_hours)+'h'}</span></div><div class="foot"><span>${esc(t.owner)}</span><span>${dateLabel(t.end)} 验收目标</span></div>${(t.deps||[]).length?`<div class="deps">前置 ${esc(t.deps.join(' · '))}</div>`:''}</a>`).join('')||'<div class="empty">当前筛选下无待办项</div>'}</div></div>`;}).join('');}
function day(v){const n=Date.parse(v+'T00:00:00Z');return Number.isFinite(n)?Math.floor(n/86400000):null;}
function iso(n){return new Date(n*86400000).toISOString().slice(0,10);}
function renderGantt(data){const unknown=timeMode==='ai'?data.filter(t=>t.ai_hours==null).length:0;if(timeMode==='ai')data=data.filter(t=>t.ai_hours>0).map(t=>({...t,start:t.ai_start,end:t.ai_end}));const dated=data.filter(t=>day(t.start)!==null&&day(t.end)!==null&&day(t.end)>=day(t.start));const el=document.querySelector('#timeline');setLink(document.querySelector('#gantt-link'),timeMode==='ai'?links.ai_gantt:links.gantt);if(!dated.length){el.innerHTML='<div class="filtered-empty">当前筛选没有已排期任务</div>';document.querySelector('#range-label').textContent='未排期';return;}const start=Math.min(...dated.map(t=>day(t.start)))-1,end=Math.max(...dated.map(t=>day(t.end)))+1,n=end-start+1,w=n>90?12:Math.max(26,Math.min(60,Math.floor((document.querySelector('.app').clientWidth-240)/n)));const today=day(new Intl.DateTimeFormat('en-CA',{timeZone:uiConfig.timeZone||'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()));el.style.setProperty('--days',n);el.style.setProperty('--day-width',w+'px');el.style.setProperty('--time-width',(n*w)+'px');let cells='';for(let d=start;d<=end;d++){const str=iso(d);cells+=`<span class="${d===today?'today':''}"><b>${str.slice(8)}</b>${str.slice(5,7)}月</span>`;}el.innerHTML=`<div class="tl-row tl-scale"><div class="tl-label">任务 / 排期</div><div class="days">${cells}</div></div>`+dated.map(t=>`<div class="tl-row"><a class="tl-label" href="${esc(t.url||'#')}" target="_blank" rel="noopener" title="${esc(tooltip(t))}"><span class="id">${t.child?'↳ ':''}${esc(t.id)}</span>${esc(t.title)}</a><div class="track">${today>=start&&today<=end?`<i class="nowline" style="left:${(today-start)*w}px"></i>`:''}<a class="task-bar ${t.child?'child-bar':''}" style="grid-column:${day(t.start)-start+1}/span ${day(t.end)-day(t.start)+1};--accent:${color(t)}" href="${esc(t.url||'#')}" target="_blank" rel="noopener" title="${esc(tooltip(t))}">${timeMode==='ai'?esc(t.ai_hours)+'h':esc(t.id)}</a></div></div>`).join('');document.querySelector('#range-label').textContent=`${timeMode==='ai'?'AI实施（工时见标签，非连续占用）':'交付/验收（含外部等待）'} · ${iso(start)} - ${iso(end)} · ${dated.length} 项${data.length>dated.length?' · '+(data.length-dated.length)+' 项未排期':''}${unknown?' · '+unknown+' 项待登记工时':''} · 可横向滚动`;document.querySelector('#legend').innerHTML=['P0','P1','P2','P3'].map(p=>`<span><i class="dot" style="--accent:${colors[p]}"></i>${p}</span>`).join('')+'<span>细时间条：子任务</span>';}
function refresh(){const data=filtered();renderBoard(data);renderGantt(data);}
setLink(document.querySelector('#tasklist-link'),links.tasks);
const allStages=[...stageOrder.filter(s=>tasks.some(t=>t.stage===s)),...[...new Set(tasks.map(t=>t.stage).filter(Boolean))].filter(s=>!stageOrder.includes(s))];
document.querySelector('#stage').innerHTML+=allStages.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');
document.querySelector('#category').innerHTML+=[...new Set(tasks.map(t=>t.category))].map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
document.querySelectorAll('[data-group]').forEach(b=>b.classList.toggle('active',b.dataset.group===group));
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-selected',x===b?'true':'false');});document.querySelectorAll('.panel').forEach(x=>x.hidden=x.id!==b.dataset.tab);}));
document.querySelectorAll('[data-group]').forEach(b=>b.addEventListener('click',()=>{group=b.dataset.group;document.querySelectorAll('[data-group]').forEach(x=>x.classList.toggle('active',x===b));refresh();}));
document.querySelectorAll('[data-time]').forEach(b=>b.addEventListener('click',()=>{timeMode=b.dataset.time;document.querySelectorAll('[data-time]').forEach(x=>x.classList.toggle('active',x===b));refresh();}));
['search','stage','category','level','completion'].forEach(id=>document.getElementById(id).addEventListener(id==='search'?'input':'change',refresh));
renderSummary();refresh();
</script></body></html>
