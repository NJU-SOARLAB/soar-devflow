name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Run privacy leak scan
        run: python3 scripts/privacy_scan.py

      - name: Validate companion docs site gates
        run: python3 skills/soar-devflow-docs/scripts/check_docs.py --config site/docs.config.json --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Build companion VitePress site
        working-directory: site
        run: |
          npm ci
          npm run build
