name: Deploy Companion Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "skills/soar-devflow-tasks/scripts/render_overview.py"
      - "skills/soar-devflow-tasks/assets/overview_template.html"
      - "skills/soar-devflow-docs/scripts/check_docs.py"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate docs gates
        run: python3 skills/soar-devflow-docs/scripts/check_docs.py --config site/docs.config.json --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Build VitePress site
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Add .nojekyll
        run: touch site/.vitepress/dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
